<!DOCTYPE html>
<html>
<!-- tells browser that the document is html file -->

<!-- title sets the browser tab name -->
<head>
  <title>1-year ACR Risk Calculator </title>

  <!-- page formatting -->
  <!-- sets font to Arial, adds padding, inputs and dropdowns styled for spacing, labels bolded and spaced vertically -->
  <style>
    body { font-family: Arial; padding: 20px; max-width: 600px; margin: auto; }
    input, select { margin: 5px; padding: 5px; width: 100%; }
    label { font-weight: bold; display: block; margin-top: 15px; }
  </style>
</head>
<body>
  <!-- below starts the content visible on the webpage -->

  <h2>Calculate Risk of Rejection within 1 year after Conversion to Belatacept - version 0.0 </h2>

  <!-- create input field for days since transplant, numeric type, default is 100 -->
  <label for="belaDays">Days from transplant to belatacept switch:</label>
  <input type="number" id="belaDays" value="180">

  <!-- input field for HLA mismatch, numeric type, forced value range 0-6 -->
  <label for="hla">HLA Mismatch (0–6):</label>
  <input type="number" id="hla" value="0" min="0" max="6">

  <!-- input field for type of induction -->
  <label for="induction">Induction Category:</label>
  <select id="induction">
    <option value="0"> Thymoglobulin </option>
    <option value="0"> Alemtuzumab </option>
    <option value="1"> Basiliximab </option>
  </select>

  <!-- input field for race input -->
  <label for="race">Race Category:</label>   <!-- links to dropdown via for="race" matching to id="race" below -->
  <select id="race"> <!-- creates dropdown menu with the 3 options -->
    <option value="0"> not Black </option>
    <option value="1"> Black</option>
  </select>
  
  <!-- add footnote about race variable -->
  <small style="display: block; margin-top: 5px; font-size: 0.9em; color: #555;">
    In training data, "race" was self-identified.
  </small>

  <!-- make a "calculate" button -->
  <br><br>
  <button onclick="calculateRisk()">Calculate Risk</button>

  <!-- display the result in the <span> with ID "result" -->
  <h3>Predicted Risk of ACR in 1 year: <span id="result">--</span></h3>

  <!-- JAVASCRIPT LOGIC FOR THE ACTUAL CALCULATION -->

  <script>
    function calculateRisk() {
      // read user inputted values
      const race = parseInt(document.getElementById("race").value);
      const days = parseFloat(document.getElementById("belaDays").value);
      const hla = parseInt(document.getElementById("hla").value);
      const induction = parseInt(document.getElementById("induction").value);

      // define regression coefficients - hardcoded from values from Stata calculation
	  /*

---------------------------
    Variable |   Active    
-------------+-------------
       black |  1.116927    
bela_daysf~p |  -.00129187    
hla_mismatch |  .38065009    
basiliximab  |  .91257462    
       _cons |  -3.3431952    
---------------------------

	  */
      const intercept = -3.3431952;
      const coef_race1 = 1.116927;
      const coef_days = -.00129187;
      const coef_hla = .38065009;
      const coef_induction1 = .91257462;

      // build the logistic model
      // intercept
      let log_odds = intercept;

      // days since transplant coefficient
      log_odds += coef_days * days;

      // hla mismatch coefficient
      log_odds += coef_hla * hla;

      // induction coefficient
      if (induction === 1) log_odds += coef_induction1;

      // race coefficients
      if (race === 1) log_odds += coef_race1;

      // convert log-odds to probability
      const prob = 1 / (1 + Math.exp(-log_odds));
      const percent = (prob * 100).toFixed(1);

      // display result on the page
      document.getElementById("result").innerText = percent + "%";
    }
  </script>
</body>
</html>
